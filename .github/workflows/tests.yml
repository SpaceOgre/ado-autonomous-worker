name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/Ado.AutonomousWorker.Tests/Ado.AutonomousWorker.Tests.csproj

      - name: Build
        run: dotnet build tests/Ado.AutonomousWorker.Tests/Ado.AutonomousWorker.Tests.csproj --no-restore

      - name: Test
        run: dotnet run --project tests/Ado.AutonomousWorker.Tests/Ado.AutonomousWorker.Tests.csproj --no-build
